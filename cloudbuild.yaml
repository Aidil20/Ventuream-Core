steps:
  # 1. Menjalankan Security Scan (SAST)
  - name: 'golang:1.22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -quiet ./...

  # 2. Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ventuream-core:$COMMIT_SHA', '.']

  # 3. Push Image ke Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ventuream-core:$COMMIT_SHA']

  # 4. Deploy ke Google Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ventuream-core'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ventuream-core:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/ventuream-core:$COMMIT_SHA'
